name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: infind-linux-x86_64
          - os: macos-14   # Apple silicon
            artifact: infind-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (compiles kiln and llama.cpp too)
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Package
        run: scripts/package.sh
      - name: Install the app and run it (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/install.sh
          test -x ~/Applications/infind.app/Contents/MacOS/infind-gui
          ~/Applications/infind.app/Contents/MacOS/infind --version
          ~/.local/bin/infind status
          plutil -lint ~/Applications/infind.app/Contents/Info.plist
          codesign --verify ~/Applications/infind.app && echo signed
          ls -la ~/Applications/infind.app/Contents/Frameworks ~/Applications/infind.app/Contents/Resources
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.tar.gz
          retention-days: 7
