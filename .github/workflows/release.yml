name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    # An older runner on purpose: the bundle then runs on any newer glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        run: scripts/package.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --generate-notes --title "infind $GITHUB_REF_NAME"
