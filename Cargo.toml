[package]
name = "infind"
version = "0.3.0"
repository = "https://github.com/RaihanulHaque/infind"
readme = "README.md"
edition = "2021"
description = "Describe it. Find it. On-device content search for Linux, built on kiln + llama.cpp."
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "infind"
path = "src/main.rs"

[[bin]]
name = "infind-gui"
path = "src/bin/infind-gui/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.36", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }
open = "5"
notify = "8"
ureq = "2"
sha2 = "0.10"

# The display servers are a Linux matter; macOS uses its own windowing.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland"] }

[profile.release]
opt-level = 3
